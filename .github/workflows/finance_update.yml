name: Daily Finance News Update

on:
  schedule:
    # 北京时间早上 8:00 = UTC 0:00
    # - cron: '0 0 * * *'
    # 北京时间上午 9:50 = UTC 1:50
    - cron: '0 5 2 * * *'
    # 北京时间中午 12:00 = UTC 4:00
    # - cron: '0 4 * * *'
    # 北京时间晚上 20:30 = UTC 12:30
    # - cron: '30 12 * * *'

  workflow_dispatch: # 允许手动触发

# 必须显式开启写权限，否则机器人无法推送代码
permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true # 提前适配 Node.js 24，消除弃用警告

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' # 修正了之前的 python_version 参数名错误

      - name: Install dependencies
        run: pip install feedparser

      - name: Fetch and Update News
        run: python scripts/finance_bot/news_fetcher.py

      - name: Commit and Push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add docs/finance/daily-news.md
          git commit -m "chore(finance): 自动更新每日热点简讯" || echo "No changes to commit"
          git push