name: Daily Finance News Update

on:
  schedule:
    # 每天北京时间早上 9 点运行 (UTC 1:00)
    - cron: '0 1 * * *'
  workflow_dispatch: # 允许手动触发

# 必须显式开启写权限，否则机器人无法推送代码
permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' # 修正了之前的 python_version 参数名错误

      - name: Install dependencies
        run: pip install feedparser

      - name: Fetch and Update News
        run: python scripts/finance_bot/news_fetcher.py

      - name: Commit and Push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add docs/finance/index.md
          git commit -m "chore(finance): 自动更新每日热点简讯" || echo "No changes to commit"
          git push
