<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- 云端征途 (The Alpine Path) - 经典的 S 型盘山公路曲线 -->
  
  <defs>
    <linearGradient id="road-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1d3557;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#1d3557;stop-opacity:0.8" />
    </linearGradient>
  </defs>

  <!-- S 型核心路径 (盘山公路最纯粹的曲线) -->
  <path d="M20,85 C20,85 80,85 80,70 C80,55 20,55 20,40 C20,25 80,25 80,10" 
        fill="none" 
        stroke="url(#road-grad)" 
        stroke-width="8" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
  
  <!-- 山顶的灵感之点 (Dot) -->
  <circle cx="80" cy="10" r="10" fill="#ff3b30"/>
</svg>
